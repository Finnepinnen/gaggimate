name: Web Check

on:
  push:
    paths:
      - 'web/**'
      - 'src/display/**'
      - 'docs/websocket-api.yaml'
      - 'schema/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/display/**'
      - 'docs/websocket-api.yaml'
      - 'schema/**'
      - '.github/workflows/web-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint:check
      - name: Format check
        run: npm run format:check
      # Type-checks every .js/.jsx file with noImplicitAny; see web/jsconfig.json.
      - name: Type check
        run: npm run typecheck
      # docs/websocket-api.yaml must cover every message type used by the firmware and web UI.
      - name: WebSocket contract check
        run: npm run contract:check
