asyncapi: '2.6.0'
info:
  title: GaggiMate WebSocket API
  version: '1.0.0'
  description: |
    This document describes the WebSocket interface exposed by the
    GaggiMate display firmware. Clients connect to `/ws` using the
    `ws://` or `wss://` protocol. Messages are JSON objects containing
    a `tp` field that specifies the type of message.
servers:
  production:
    url: '{protocol}://{host}/ws'
    protocol: ws
    description: WebSocket server
    variables:
      protocol:
        enum: [ws, wss]
        default: ws
      host:
        default: localhost
channels:
  '/ws':
    description: All messages share the same WebSocket channel.
    subscribe:
      description: Messages sent from the server to the client.
      message:
        oneOf:
          - $ref: '#/components/messages/StatusEvent'
          - $ref: '#/components/messages/OtaSettingsResponse'
          - $ref: '#/components/messages/OtaProgressEvent'
          - $ref: '#/components/messages/AutotuneResultEvent'
          - $ref: '#/components/messages/ProfilesListResponse'
          - $ref: '#/components/messages/ProfilesLoadResponse'
          - $ref: '#/components/messages/ProfilesSaveResponse'
          - $ref: '#/components/messages/ProfilesDeleteResponse'
          - $ref: '#/components/messages/ProfilesSelectResponse'
          - $ref: '#/components/messages/ProfilesFavoriteResponse'
          - $ref: '#/components/messages/ProfilesUnfavoriteResponse'
          - $ref: '#/components/messages/ProfilesReorderResponse'
          - $ref: '#/components/messages/BrewConfirmEvent'
          - $ref: '#/components/messages/BrewConfirmCancelEvent'
          - $ref: '#/components/messages/ScaleScanCompleteEvent'
          - $ref: '#/components/messages/ScaleConnectErrorEvent'
          - $ref: '#/components/messages/ScaleConnectSuccessEvent'
          - $ref: '#/components/messages/ScaleDisconnectEvent'
          - $ref: '#/components/messages/FlushStartResponse'
          - $ref: '#/components/messages/CleaningResponse'
          - $ref: '#/components/messages/FlushStopResponse'
          - $ref: '#/components/messages/SetupTestResponse'
          - $ref: '#/components/messages/SetupTestEvent'
          - $ref: '#/components/messages/WifiScanResponse'
          - $ref: '#/components/messages/WifiScanEvent'
          - $ref: '#/components/messages/AutotuneFailedEvent'
          - $ref: '#/components/messages/HardwareScaleEvent'
          - $ref: '#/components/messages/HistoryRebuildProgressEvent'
          - $ref: '#/components/messages/HistoryShotSavedEvent'
          - $ref: '#/components/messages/ShotFinishedStatsEvent'
          - $ref: '#/components/messages/HistoryRebuildResponse'
          - $ref: '#/components/messages/HistoryDeleteResponse'
          - $ref: '#/components/messages/HistoryNotesGetResponse'
          - $ref: '#/components/messages/HistoryNotesSaveResponse'
          - $ref: '#/components/messages/MahlkonigStatusResponse'
    publish:
      description: Messages sent from the client to the server.
      message:
        oneOf:
          - $ref: '#/components/messages/OtaSettingsRequest'
          - $ref: '#/components/messages/OtaStartRequest'
          - $ref: '#/components/messages/AutotuneStartRequest'
          - $ref: '#/components/messages/ProfilesListRequest'
          - $ref: '#/components/messages/ProfilesLoadRequest'
          - $ref: '#/components/messages/ProfilesSaveRequest'
          - $ref: '#/components/messages/ProfilesDeleteRequest'
          - $ref: '#/components/messages/ProfilesSelectRequest'
          - $ref: '#/components/messages/ProfilesFavoriteRequest'
          - $ref: '#/components/messages/ProfilesUnfavoriteRequest'
          - $ref: '#/components/messages/ProfilesReorderRequest'
          - $ref: '#/components/messages/ProcessActivateRequest'
          - $ref: '#/components/messages/BrewConfirmCancelRequest'
          - $ref: '#/components/messages/FlushStartRequest'
          - $ref: '#/components/messages/CleaningStartRequest'
          - $ref: '#/components/messages/CleaningCompleteRequest'
          - $ref: '#/components/messages/FlushStopRequest'
          - $ref: '#/components/messages/SetupTestStartRequest'
          - $ref: '#/components/messages/SetupTestAbortRequest'
          - $ref: '#/components/messages/WifiScanRequest'
          - $ref: '#/components/messages/ProcessDeactivateRequest'
          - $ref: '#/components/messages/ProcessClearRequest'
          - $ref: '#/components/messages/GrindActivateRequest'
          - $ref: '#/components/messages/GrindDeactivateRequest'
          - $ref: '#/components/messages/ChangeModeRequest'
          - $ref: '#/components/messages/ChangeTargetRequest'
          - $ref: '#/components/messages/AdjustSetpointRequest'
          - $ref: '#/components/messages/ScaleTareRequest'
          - $ref: '#/components/messages/HistoryRebuildRequest'
          - $ref: '#/components/messages/HistoryDeleteRequest'
          - $ref: '#/components/messages/HistoryNotesGetRequest'
          - $ref: '#/components/messages/HistoryNotesSaveRequest'
          - $ref: '#/components/messages/MahlkonigStatusRequest'
components:
  schemas:
    StatusPayload:
      type: object
      description: >-
        Partial by design: a frame carries either the fast telemetry (every 500 ms) or the
        slow-changing state (sent when it changes, at least every 10 s, and in full to a client
        right after it connects). Consumers merge each frame onto their last known status; a key
        that is absent keeps its previous value, a key sent as null clears it.
      properties:
        tp:
          type: string
          enum: ['evt:status']
        ct:
          type: number
          description: Current temperature
        tt:
          type: number
          description: Target temperature
        pr:
          type: number
          description: Current pressure
        fl:
          type: number
          description: Current flow
        sys:
          type: object
          description: Display system state (slow-state frame), mirrors the standby screen label.
          properties:
            s:
              type: string
              enum: [starting, waiting, ready, updating, autotuning, mismatch, error]
            m:
              type: string
              description: Human-readable message shown on the display, empty when ready
            c:
              type: integer
              description: Controller error code (0 = none)
        warn:
          type: array
          description: Machine warnings, one entry per warning type.
          items:
            $ref: '#/components/schemas/WarningState'
        pt:
          type: number
          description: Target pressure
        m:
          type: integer
          description: Machine mode
        p:
          type: string
          description: Selected profile label
        cp:
          type: boolean
          description: Indicates pressure capability
        cd:
          type: boolean
          description: Indicates dimming capability
        puid:
          type: string
          description: Selected profile ID
        gp:
          type: boolean
          description: Indicates the addon-7 capability (grinder port)
        hs:
          type: boolean
          description: Indicates hardware scale capability
        scaleSource:
          type: string
          enum: [hardware, bluetooth, estimation, inactive]
          description: Scale that feeds volumetric measurement
        led:
          type: boolean
          description: Indicates LED control capability
        tofc:
          type: boolean
          description: Indicates ToF water level sensor capability
        sd:
          type: boolean
          description: Shot history is stored on an SD card
        tw:
          type: number
          description: Total target weight of the selected profile
        bta:
          type: integer
          enum: [0, 1]
          description: Volumetric brewing available (a scale source is active)
        bt:
          type: integer
          enum: [0, 1]
          description: Selected profile brews to a volumetric target
        btd:
          type: number
          description: Total duration of the selected profile (s)
        gtd:
          type: number
          description: Target grind duration (ms)
        gtv:
          type: number
          description: Target grind weight
        gt:
          type: integer
          enum: [0, 1]
          description: Grind uses a volumetric target
        gact:
          type: integer
          enum: [0, 1]
          description: Grinder is running
        up:
          type: boolean
          description: A firmware update is available
        bc:
          type: boolean
          description: A BLE scale is connected
        sbat:
          type: [integer, 'null']
          description: BLE scale battery percent; null when disconnected or unknown
        cst:
          type: number
          description: Current steam boiler temperature (dual boiler)
        tst:
          type: number
          description: Target steam temperature
        db:
          type: boolean
          description: Indicates dual boiler capability
        wl:
          type: integer
          description: Water tank level in percent (ToF sensor)
        tof:
          type: integer
          description: Raw ToF distance (mm)
        rssi:
          type: integer
          description: Controller BLE signal strength (dBm), 0 when disconnected
        lat:
          type: integer
          description: Display-controller round trip latency (ms), -1 = not yet measured
        rtx:
          type: integer
          description: Controller link frames resent since boot
        pw:
          type: number
          description: Current pump power (%)
        hp:
          type: number
          description: Current heater power (%)
        bw:
          type: number
          description: Current BLE scale weight, 0 when disconnected
        cw:
          type: number
          description: Current weight from the active scale source
        pkr:
          type: number
          description: Puck resistance, 0 without a process
        pf:
          type: number
          description: Puck flow, 0 without a process
        tf:
          type: number
          description: Target flow, 0 without a process
        wp:
          type: number
          description: Water pumped in the current process; absent without a process
        process:
          description: Current or last process; null when there is none (telemetry frame).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProcessState'
      required: [tp]
    ProcessState:
      type: object
      properties:
        a:
          type: integer
          enum: [0, 1]
          description: Process is active
        s:
          type: string
          enum: [infusion, brew, grind]
          description: Current phase type (only brew and grind processes report details)
        l:
          type: string
          description: Current phase name, or "Finished" / "Grinding"
        e:
          type: integer
          description: Elapsed time (ms)
        u:
          type: integer
          enum: [0, 1]
          description: Brew runs a utility profile (backflush, descaling)
        tt:
          type: string
          enum: [volumetric, time]
          description: Kind of the current phase target
        pt:
          type: number
          description: Phase target (weight, or ms for time targets)
        pp:
          type: number
          description: Phase progress in the unit of pt
      required: [a]
    WarningState:
      type: object
      properties:
        k:
          type: string
          enum: [water, flush, switch, scaleConnected, scaleBattery, temperature, backflush, descaling]
          description: Warning key
        l:
          type: integer
          enum: [0, 1, 2]
          description: Configured severity (0 = ignore, 1 = warn, 2 = error)
        a:
          type: boolean
          description: Whether the underlying condition is currently true
      required: [k, l]

    OtaSettingsPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['res:ota-settings']
        latestVersion:
          type: string
        displayVersion:
          type: string
        controllerVersion:
          type: string
        hardware:
          type: string
        displayUpdateAvailable:
          type: boolean
        controllerUpdateAvailable:
          type: boolean
        channel:
          type: string
        updating:
          type: boolean
      required: [tp]
    OtaProgressPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['evt:ota-progress']
        phase:
          type: integer
          description: >-
            0 idle, 1 display firmware, 2 display filesystem (unused), 3 controller firmware,
            4 finished, 5 failed (download or flashing gave up; the device keeps its current firmware)
          enum: [0, 1, 2, 3, 4, 5]
        progress:
          type: integer
          description: Percent of the current phase. Downloads retry and resume on connection loss, so it never goes backwards within a phase.
      required: [tp, phase, progress]
    AutotuneResultPayload:
      type: object
      properties:
        tp:
          type: string
          enum: ['evt:autotune-result']
        pid:
          type: string
      required: [tp, pid]
    ProfilePayload:
      $ref: '../schema/profile.json'
  messages:
    StatusEvent:
      payload:
        $ref: '#/components/schemas/StatusPayload'
    OtaSettingsResponse:
      payload:
        $ref: '#/components/schemas/OtaSettingsPayload'
    OtaProgressEvent:
      payload:
        $ref: '#/components/schemas/OtaProgressPayload'
    AutotuneResultEvent:
      payload:
        $ref: '#/components/schemas/AutotuneResultPayload'
    ProfilesListResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:list']
          rid:
            type: string
          profiles:
            type: array
            items:
              $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesLoadResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:load']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesSaveResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:save']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
          error:
            type: string
        required: [tp]
    ProfilesDeleteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:delete']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesSelectResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:select']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesFavoriteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:favorite']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    ProfilesUnfavoriteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:unfavorite']
          rid:
            type: string
          error:
            type: string
        required: [tp]
    OtaSettingsRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:ota-settings']
          update:
            type: boolean
          channel:
            type: string
        required: [tp]
    OtaStartRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:ota-start']
          cp:
            type: string
        required: [tp]
    AutotuneStartRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:autotune-start']
          time:
            type: integer
          samples:
            type: integer
          wattage:
            type: integer
            description: Heater wattage; 0 or absent skips the feed-forward derivation.
        required: [tp]
    ProfilesListRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:list']
          rid:
            type: string
          minimal:
            type: boolean
            description: Return only id and label per profile.
        required: [tp]
    ProfilesLoadRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:load']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesSaveRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:save']
          rid:
            type: string
          profile:
            $ref: '#/components/schemas/ProfilePayload'
        required: [tp, profile]
    ProfilesDeleteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:delete']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesSelectRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:select']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesFavoriteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:favorite']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesUnfavoriteRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:unfavorite']
          rid:
            type: string
          id:
            type: string
        required: [tp, id]
    ProfilesReorderRequest:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:profiles:reorder']
          rid:
            type: string
          order:
            type: array
            items:
              type: string
            description: Full ordered list of profile IDs.
        required: [tp, order]

    ProfilesReorderResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:profiles:reorder']
          rid:
            type: string
          # No error field; success implied
        required: [tp]

    BrewConfirmEvent:
      summary: A brew start was blocked by an error-level warning and needs confirmation.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:brew:confirm']
          warn:
            type: array
            description: Active warnings that are not ignored (active flag omitted, always true).
            items:
              $ref: '#/components/schemas/WarningState'
        required: [tp, warn]

    ProcessActivateRequest:
      summary: Start the process for the current mode.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:process:activate']
          ignoreWarnings:
            type: boolean
            default: false
            description: Start the brew even though an error-level warning is active (answer to evt:brew:confirm).
        required: [tp]

    BrewConfirmCancelEvent:
      summary: A UI declined the brew confirmation; every client should dismiss its dialog. A confirmed start is visible as an active process in evt:status.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:brew:confirm:cancel']
        required: [tp]

    ScaleScanCompleteEvent:
      summary: The listening window (5 s) after POST /api/scales/scan closed, or a connect attempt aborted it. Sent immediately when no scan could run (a scale is already connected). Discovery itself keeps running in the background.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:scale:scan:complete']
          count:
            type: integer
            description: Number of supported scales discovered so far.
        required: [tp, count]

    ScaleConnectErrorEvent:
      summary: Connecting to a BLE scale failed, after a user connect or the saved-scale auto-connect.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:scale:connect:error']
          address:
            type: string
          reason:
            type: string
            enum: ['not_found', 'connect_failed', 'unsupported']
            description: not_found = not in the discovered list, connect_failed = BLE connection failed, unsupported = no driver could be created.
        required: [tp, address, reason]

    ScaleConnectSuccessEvent:
      summary: A BLE scale connected.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:scale:connect:success']
          address:
            type: string
          name:
            type: string
            description: Advertised BLE name.
        required: [tp, address, name]

    ScaleDisconnectEvent:
      summary: A connected BLE scale was lost while the machine is awake; the display rescans and reconnects automatically. Not sent for the intentional disconnect on standby.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:scale:disconnect']
          address:
            type: string
          name:
            type: string
            description: Advertised BLE name.
        required: [tp, address, name]

    CleaningStartRequest:
      summary: Select the backflush or descaling system profile and start it in brew mode; error-level warnings trigger evt:brew:confirm as usual. Answered with res:cleaning:<task>:start (success false while a process is running).
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:cleaning:backflush:start', 'req:cleaning:descaling:start']
          rid:
            type: string
        required: [tp]
    CleaningCompleteRequest:
      summary: Mark backflush or descaling as done now, resetting its time and shot counters. Running the profile to the end does the same. Answered with res:cleaning:<task>:complete.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:cleaning:backflush:complete', 'req:cleaning:descaling:complete']
          rid:
            type: string
        required: [tp]
    CleaningResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum:
              - 'res:cleaning:backflush:start'
              - 'res:cleaning:descaling:start'
              - 'res:cleaning:backflush:complete'
              - 'res:cleaning:descaling:complete'
          rid:
            type: string
          success:
            type: boolean
        required: [tp, success]
    SetupTestStartRequest:
      summary: >-
        Start a setup-wizard hardware test. heater: steam setpoint until the temperature rose by 2.5 °C (passes right away),
        otherwise for 10 s plus 3 s settling. pressure (pressure sensor only): pump at 100 % against the closed 3-way valve until pressure
        plateaus (max 10 s), then pump off with the valve open for 5 s; passes on a peak of at least 10 bar and at most
        1 bar left after release. Progress and the result arrive as evt:setup:test.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:setup:test:start']
          rid:
            type: string
          test:
            type: string
            enum: [heater, pressure]
          ack:
            type: boolean
            description: Required true for the pressure test; the user confirmed the safety notice.
        required: [tp, test]
    SetupTestAbortRequest:
      summary: Stop the running setup test and return to standby. Answered with res:setup:test:abort.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:setup:test:abort']
          rid:
            type: string
        required: [tp]
    SetupTestResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:setup:test:start', 'res:setup:test:abort']
          rid:
            type: string
          success:
            type: boolean
          error:
            type: string
            enum: [busy, notReady, noPressureSensor, ackRequired, unknownTest]
        required: [tp, success]
    SetupTestEvent:
      summary: Setup test progress (every 250 ms while running) and its final state.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:setup:test']
          test:
            type: string
            enum: [heater, pressure]
          state:
            type: string
            enum: [running, passed, failed, aborted]
          phase:
            type: string
            enum: [idle, heating, settling, building, releasing, done]
          reason:
            type: string
            description: >-
              heater: sensor, alreadyHot (passed without heating), noRise. pressure: noPressure, lowPressure,
              noRelease, highPressure (passed, OPV set above 12.5 bar).
          startTemp:
            type: number
          temp:
            type: number
          rise:
            type: number
          targetRise:
            type: number
            description: Rise in °C the heater test needs to pass.
          pressure:
            type: number
          maxPressure:
            type: number
          residualPressure:
            type: number
        required: [tp, test, state, phase]
    WifiScanRequest:
      summary: >-
        Scan for Wi-Fi networks for the setup wizard. Only available in the AP fallback (APSTA, the station never
        connects) and not while a setup test runs. The scan returns to the AP channel between channels. Results arrive
        as evt:wifi:scan.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:wifi:scan']
          rid:
            type: string
        required: [tp]
    WifiScanResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:wifi:scan']
          rid:
            type: string
          success:
            type: boolean
          error:
            type: string
            enum: [notAp, busy]
        required: [tp, success]
    WifiScanEvent:
      summary: Scan result, one entry per SSID (strongest access point), strongest first, at most 25; hidden networks are left out.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:wifi:scan']
          success:
            type: boolean
          networks:
            type: array
            items:
              type: object
              properties:
                ssid:
                  type: string
                rssi:
                  type: integer
                secure:
                  type: boolean
                channel:
                  type: integer
        required: [tp, success, networks]
    FlushStartRequest:
      summary: Start a flush (brew valve open, pump on) for the configured flush duration; with duration 0 it runs until req:flush:stop. The valve stays open for one more second after the pump stops.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:flush:start']
          rid:
            type: string
        required: [tp]
    FlushStartResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:flush:start']
          rid:
            type: string
          success:
            type: boolean
        required: [tp]
    FlushStopRequest:
      summary: End a hold-to-flush (flush duration 0). Ignored while a fixed-length flush runs.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:flush:stop']
          rid:
            type: string
        required: [tp]
    FlushStopResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:flush:stop']
          rid:
            type: string
          success:
            type: boolean
        required: [tp]
    BrewConfirmCancelRequest:
      summary: Decline the pending brew confirmation on behalf of all UIs.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:brew:confirm:cancel']
        required: [tp]

    AutotuneFailedEvent:
      summary: Autotune timed out on the controller (no result follows).
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:autotune-failed']
        required: [tp]

    HardwareScaleEvent:
      summary: Raw load cell diagnostics, every 200 ms while a client is connected and the controller has a hardware scale.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:hardware-scale']
          c1:
            type: number
            description: Weight of load cell 1
          c2:
            type: number
            description: Weight of load cell 2
          c1v:
            type: boolean
            description: Load cell 1 reading is valid
          c2v:
            type: boolean
            description: Load cell 2 reading is valid
        required: [tp, c1, c2, c1v, c2v]

    HistoryRebuildProgressEvent:
      summary: Progress of the shot history index rebuild started with req:history:rebuild.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:history-rebuild-progress']
          total:
            type: integer
            description: Number of shot files to process (0 while scanning)
          current:
            type: integer
            description: Number of shot files processed so far
          status:
            type: string
            enum: [scanning, started, processing, completed, error]
        required: [tp, total, current, status]

    HistoryShotSavedEvent:
      summary: A finished shot was written to history; clients can refetch it.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:history-shot-saved']
          id:
            type: integer
            description: Shot id
        required: [tp, id]

    ShotFinishedStatsEvent:
      summary: Summary stats of a just-finished shot, sent before the history file is written.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['evt:shot-finished-stats']
          maxPressure:
            type: number
            description: Peak pressure (bar)
          avgFlow:
            type: number
            description: Average pump flow (ml/s)
        required: [tp, maxPressure, avgFlow]

    ProcessDeactivateRequest:
      summary: Stop the running process and clear it.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:process:deactivate']
        required: [tp]

    ProcessClearRequest:
      summary: Clear the last (finished) process, e.g. to dismiss the finished-shot view.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:process:clear']
        required: [tp]

    GrindActivateRequest:
      summary: Start grinding with the current grind target.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:grind:activate']
        required: [tp]

    GrindDeactivateRequest:
      summary: Stop grinding.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:grind:deactivate']
        required: [tp]

    ChangeModeRequest:
      summary: Stop and clear any process and switch the machine mode. Ignored unless the system state is ready.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:change-mode']
          mode:
            type: integer
            enum: [0, 1, 2, 3, 4]
            description: 0 standby, 1 brew, 2 steam, 3 water, 4 grind
        required: [tp, mode]

    ChangeTargetRequest:
      summary: Choose between a time and a volumetric target. Both types set the same shared setting.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:change-brew-target', 'req:change-grind-target']
          target:
            type: integer
            enum: [0, 1]
            description: 0 time, 1 volumetric
        required: [tp, target]

    AdjustSetpointRequest:
      summary: >-
        Step a setpoint up or down, like the display's +/- buttons: target temperature by 1 degree,
        the selected profile's brew target or the grind target (time or weight, by one step).
      payload:
        type: object
        properties:
          tp:
            type: string
            enum:
              - 'req:raise-temp'
              - 'req:lower-temp'
              - 'req:raise-brew-target'
              - 'req:lower-brew-target'
              - 'req:raise-grind-target'
              - 'req:lower-grind-target'
        required: [tp]

    ScaleTareRequest:
      summary: Tare the active scale.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:scale:tare']
        required: [tp]

    HistoryRebuildRequest:
      summary: Rebuild the shot history index from the shot files in the background; progress follows as evt:history-rebuild-progress.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:history:rebuild']
          rid:
            type: string
        required: [tp]
    HistoryRebuildResponse:
      summary: Immediate acknowledgement of req:history:rebuild.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:history:rebuild']
          rid:
            type: string
          msg:
            type: string
          error:
            type: string
            description: Set when refused, e.g. during a firmware update.
        required: [tp]

    HistoryDeleteRequest:
      summary: Delete a shot, its notes and its index entry.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:history:delete']
          rid:
            type: string
          id:
            type: [string, integer]
            description: Shot id without zero padding
        required: [tp, id]
    HistoryDeleteResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:history:delete']
          rid:
            type: string
          msg:
            type: string
          error:
            type: string
            description: Set when refused, e.g. during a firmware update.
        required: [tp]

    HistoryNotesGetRequest:
      summary: Load the notes of a shot.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:history:notes:get']
          rid:
            type: string
          id:
            type: [string, integer]
            description: Shot id without zero padding
        required: [tp, id]
    HistoryNotesGetResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:history:notes:get']
          rid:
            type: string
          notes:
            description: The stored notes, null when the shot has none.
            oneOf:
              - type: 'null'
              - $ref: '../schema/shot_notes.json'
          error:
            type: string
            description: Set when refused, e.g. during a firmware update.
        required: [tp]

    HistoryNotesSaveRequest:
      summary: Replace the notes of a shot; rating and doseOut are also written to the history index.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:history:notes:save']
          rid:
            type: string
          id:
            type: [string, integer]
            description: Shot id without zero padding
          notes:
            $ref: '../schema/shot_notes.json'
        required: [tp, id, notes]
    HistoryNotesSaveResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:history:notes:save']
          rid:
            type: string
          msg:
            type: string
          error:
            type: string
            description: Set when refused, e.g. during a firmware update.
        required: [tp]

    MahlkonigStatusRequest:
      summary: Status of the Mahlkönig grind-by-sync integration. Only answered when that plugin is enabled.
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['req:mahlkonig:status']
          rid:
            type: string
        required: [tp]
    MahlkonigStatusResponse:
      payload:
        type: object
        properties:
          tp:
            type: string
            enum: ['res:mahlkonig:status']
          rid:
            type: string
          connected:
            type: boolean
            description: The grinder polled the display recently
          phase:
            type: string
            enum: [idle, brewing, settling, finishing]
          grind:
            type: object
            properties:
              targetWeight:
                type: number
              recipe:
                type: integer
              profileId:
                type: string
          shot:
            type: object
            properties:
              timeMs:
                type: integer
              weight:
                type: number
        required: [tp, connected, phase]
